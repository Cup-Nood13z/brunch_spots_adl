    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  var brunchIcon = L.divIcon({
    html: '<div style="background:#c96a4e;width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,0.4);"><span style="transform:rotate(45deg);font-size:12px;">🥐</span></div>',
    className: '', iconSize: [24,24], iconAnchor: [12,24]
  });

  var areas = [...new Set(spots.map(s => s.area))];
  var markers = {};
  var filterDiv = document.getElementById('brunch-filters');

  function addFilterBtn(label, area) {
    var btn = document.createElement('button');
    btn.textContent = label;
    btn.style.cssText = 'border:1px solid #c96a4e;background:#fff;color:#c96a4e;padding:4px 10px;border-radius:16px;font-size:12px;cursor:pointer;';
    btn.onclick = function() {
      Object.keys(markers).forEach(function(a) {
        markers[a].forEach(function(m) {
          if (area === 'All' || a === area) { if (!map.hasLayer(m)) map.addLayer(m); }
          else { if (map.hasLayer(m)) map.removeLayer(m); }
        });
      });
    };
    filterDiv.appendChild(btn);
  }
  addFilterBtn('All', 'All');
  areas.forEach(function(a) { addFilterBtn(a, a); });

  spots.forEach(function(s) {
    var m = L.marker([s.lat, s.lng], {icon: brunchIcon}).addTo(map);
    m.bindPopup(

    );
